; Nodo ESP32 de CampusIoT. Compilar y subir con PlatformIO (extensión de VS Code o `pio run -e placaN -t upload`).
; Una placa por radar: placa1 = zona A y placa2 = zona B (nodo-gastronomia), placa3 = zona S (nodo-sotano).
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4
    ncmreynolds/ld2410@0.2.2

[env:placa1]
build_flags = -DPLACA_ID=1

[env:placa2]
build_flags = -DPLACA_ID=2

[env:placa3]
build_flags = -DPLACA_ID=3