; Nodo ESP32 de CampusIoT. Compilar y subir con PlatformIO (extensión de VS Code o `pio run -t upload`).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4
    ncmreynolds/ld2410     ; fijar la versión que funcione cuando se pruebe en banco
